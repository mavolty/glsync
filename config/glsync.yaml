server:
  port: 8090
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 15s
  # admin_token: set via GLSYNC_SERVER__ADMIN_TOKEN env var.
  # If empty, /api/v1/admin/* routes return 404 (disabled).
  admin_token: ""

database:
  # url: set via GLSYNC_DATABASE__URL env var (required).
  # Example: postgres://glsync:glsync@localhost:5432/glsync?sslmode=require
  url: ""
  max_connections: 20
  min_connections: 2

gitlab:
  webhook_secret: ""
  # base_url: Your GitLab instance root URL. Required for emoji counting API calls.
  # Example: https://gitlab.example.com
  # Set via GLSYNC_GITLAB__BASE_URL env var.
  base_url: ""
  # api_token: GitLab personal access token with read_api scope.
  # Required for counting emoji reactions on MRs.
  # Set via GLSYNC_GITLAB__API_TOKEN env var.
  api_token: ""

jira:
  base_url: ""
  username: ""
  api_token: ""
  timeout: 15s

workflow:
  # project_key: Your Jira project prefix (e.g. "PROJ", "ENG", "DEV").
  # Issue keys like PROJ-123 are extracted from branch names, MR titles, and commit messages.
  project_key: "YOUR_PROJECT"
  develop_branch: "develop"
  master_branch: "master"
  transitions:
    # Jira transition IDs are project-specific integers.
    # Discover yours: curl -u EMAIL:TOKEN https://YOUR_JIRA/rest/api/2/issue/TICKET-1/transitions
    code_review: "14" # example → Code Review
    rfqa: "15"        # example → RFQA / Staging
    done: "17"        # example → Done

  # Emoji-based done trigger: any thumbsup emoji on a merged MR triggers → Done
  done_emoji: "thumbsup"

  in_progress:
    transition_id: "2" # example: To Do → In Progress
    # "sprint_end": due date = next sprint end weekday
    # "story_points": due date = today + story_points days
    due_date_strategy: "sprint_end"
    sprint_end_weekday: "tuesday"
    # Jira custom field IDs vary per instance — find yours via:
    # curl -u EMAIL:TOKEN https://YOUR_JIRA/rest/api/2/issue/TICKET-1?expand=names
    start_date_field: "customfield_10040"   # example: Start date field
    due_date_field: "duedate"               # standard Jira due date field
    story_points_field: "customfield_10027" # example: Story Points field

worker:
  concurrency: 1
  poll_interval: 5s
  max_attempts: 5

reconcile:
  enabled: true
  interval: 15m
  stuck_job_timeout: 5m

openclaw:
  # hook_url: OpenClaw /hooks/agent endpoint. Leave empty to disable dispatch.
  # Set via GLSYNC_OPENCLAW__HOOK_URL env var.
  # Example: http://127.0.0.1:18789/hooks/agent
  hook_url: ""
  # hook_token: Bearer token for the hooks endpoint.
  # Set via GLSYNC_OPENCLAW__HOOK_TOKEN env var.
  hook_token: ""
  # dry_run: when true, logs the intended dispatch but makes no HTTP call.
  # Set via GLSYNC_OPENCLAW__DRY_RUN=true env var.
  dry_run: false
  timeout: 10s
