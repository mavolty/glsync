server:
  port: 8090
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 15s
  # admin_token: set via GLSYNC_SERVER__ADMIN_TOKEN env var.
  # If empty, /api/v1/admin/* routes return 404 (disabled).
  admin_token: ""

database:
  # url: set via GLSYNC_DATABASE__URL env var (required).
  # Example: postgres://glsync:glsync@localhost:5432/glsync?sslmode=require
  url: ""
  max_connections: 20
  min_connections: 5

gitlab:
  webhook_secret: ""

jira:
  base_url: ""
  username: ""
  api_token: ""
  timeout: 15s

workflow:
  project_key: "RIS"
  develop_branch: "develop"
  master_branch: "master"
  transitions:
    code_review: "15" # "Done Dev" -> Ready to Code Review
    rfqa: "5" # "Ready to QA"
    # done: leave empty until the Jira workflow has a transition from RFQA -> Done.
    # To find the correct ID, call: GET <jira_base_url>/rest/api/2/issue/<any-rfqa-ticket>/transitions
    # and look for the transition named "Done" or similar. Set GLSYNC_WORKFLOW__TRANSITIONS__DONE.
    done: ""

  in_progress:
    transition_id: "2" # To Do -> In Progress
    # "sprint_end": due date = next sprint end day (e.g. Tuesday)
    # "story_points": due date = today + story_points days
    due_date_strategy: "sprint_end"
    sprint_end_weekday: "tuesday"
    start_date_field: "customfield_10040" # Start date
    due_date_field: "duedate" # Due date
    story_points_field: "customfield_10027" # Story Points

worker:
  concurrency: 3
  poll_interval: 5s
  max_attempts: 5

reconcile:
  enabled: true
  interval: 15m
  stuck_job_timeout: 5m
  drift_lookback: 1h
