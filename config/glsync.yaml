server:
  port: 8090
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 15s
  # admin_token: set via GLSYNC_SERVER__ADMIN_TOKEN env var.
  # If empty, /api/v1/admin/* routes return 404 (disabled).
  admin_token: ""

database:
  # url: set via GLSYNC_DATABASE__URL env var (required).
  # Example: postgres://glsync:glsync@localhost:5432/glsync?sslmode=require
  url: ""
  max_connections: 20
  min_connections: 2

gitlab:
  webhook_secret: ""
  # base_url: Your GitLab instance root URL. Required for emoji counting API calls.
  # Example: https://gitlab.example.com
  # Set via GLSYNC_GITLAB__BASE_URL env var.
  base_url: ""
  # api_token: GitLab personal access token with read_api scope.
  # Required for counting emoji reactions on MRs.
  # Set via GLSYNC_GITLAB__API_TOKEN env var.
  api_token: ""

jira:
  base_url: ""
  username: ""
  api_token: ""
  timeout: 15s

workflow:
  project_key: "RIS"
  develop_branch: "develop"
  master_branch: "master"
  transitions:
    code_review: "14" # Start → Code Review
    rfqa: "15"        # Code Review → RFQA
    done: "31"        # RFQA → Done

  # Emoji-based done trigger: requires N thumbsup on a merged MR targeting master
  done_emoji: "thumbsup"
  done_emoji_threshold: 2

  in_progress:
    transition_id: "2" # To Do -> In Progress
    # "sprint_end": due date = next sprint end day (e.g. Tuesday)
    # "story_points": due date = today + story_points days
    due_date_strategy: "sprint_end"
    sprint_end_weekday: "tuesday"
    start_date_field: "customfield_10040" # Start date
    due_date_field: "duedate" # Due date
    story_points_field: "customfield_10027" # Story Points

worker:
  concurrency: 1
  poll_interval: 5s
  max_attempts: 5

reconcile:
  enabled: true
  interval: 15m
  stuck_job_timeout: 5m
