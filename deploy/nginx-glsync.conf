# /etc/nginx/sites-available/glsync
# Enable: sudo ln -s /etc/nginx/sites-available/glsync /etc/nginx/sites-enabled/
# TLS: use certbot or your company's cert

server {
    listen 80;
    server_name glsync.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name glsync.example.com;

    ssl_certificate     /etc/ssl/certs/glsync.crt;
    ssl_certificate_key /etc/ssl/private/glsync.key;

    # Only allow GitLab server and internal team IPs
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # deny all;

    location /api/v1/webhooks/gitlab {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8090;
    }

    location /readyz {
        proxy_pass http://127.0.0.1:8090;
    }

    # Admin endpoints — restrict to internal IPs only
    location /api/v1/admin/ {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
