services:
  postgres:
    image: postgres:16-alpine
    container_name: glsync-pg
    environment:
      POSTGRES_USER: glsync
      POSTGRES_PASSWORD: glsync
      POSTGRES_DB: glsync
    ports:
      - "5432:5432"
    volumes:
      - glsync_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glsync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  glsync_pg_data:
